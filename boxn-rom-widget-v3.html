<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxn romfordeling</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: #FFFFFF;
    color: #212527;
    box-sizing: border-box;
    padding: 8px;
  }
  /* Rutenett: 3 kolonner og 9 rader (2 høye + 5 enkle + 2 høye).
     Hvert rom plasseres med grid-column og grid-row under. */
  #grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    gap: 4px;
    width: 100%;
    height: 100%;
    min-height: 360px;
  }
  .cell {
    position: relative;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F7F8;
    border: 1px solid #D6DADC;
    border-radius: 6px;
  }
  .nr { font-size: 18px; font-weight: 600; color: #212527; line-height: 1; }
  .size { position: absolute; left: 6px; bottom: 4px; font-size: 10px; font-weight: 500; color: #464F53; line-height: 1; }
  .screen { background: #EEF0F1; }
  .screen .nr { font-size: 13px; font-weight: 500; color: #464F53; }

  /* Brukes først når status legges inn (se setStatus nederst). */
  .cell[data-status="ledig"]     { background: #DCFCE7; }
  .cell[data-status="opptatt"]   { background: #EEF0F1; }
  .cell[data-status="reservert"] { background: #FEF3C7; }
  .cell[data-status="feil"]      { background: #FEE2E2; }
</style>

  <div id="grid" role="group" aria-label="Romfordeling i skapet">
    <div class="cell" data-room="18" style="grid-column:1;grid-row:1 / span 2" aria-label="Rom 18, størrelse L"><span class="nr">18</span><span class="size">L</span></div>
    <div class="cell" data-room="4" style="grid-column:1;grid-row:3 / span 1" aria-label="Rom 4, størrelse M"><span class="nr">4</span><span class="size">M</span></div>
    <div class="cell" data-room="5" style="grid-column:1;grid-row:4 / span 1" aria-label="Rom 5, størrelse M"><span class="nr">5</span><span class="size">M</span></div>
    <div class="cell" data-room="6" style="grid-column:1;grid-row:5 / span 1" aria-label="Rom 6, størrelse M"><span class="nr">6</span><span class="size">M</span></div>
    <div class="cell" data-room="7" style="grid-column:1;grid-row:6 / span 1" aria-label="Rom 7, størrelse M"><span class="nr">7</span><span class="size">M</span></div>
    <div class="cell" data-room="8" style="grid-column:1;grid-row:7 / span 1" aria-label="Rom 8, størrelse M"><span class="nr">8</span><span class="size">M</span></div>
    <div class="cell" data-room="15" style="grid-column:1;grid-row:8 / span 2" aria-label="Rom 15, størrelse L"><span class="nr">15</span><span class="size">L</span></div>
    <div class="cell" data-room="17" style="grid-column:2;grid-row:1 / span 2" aria-label="Rom 17, størrelse L"><span class="nr">17</span><span class="size">L</span></div>
    <div class="cell" data-room="3" style="grid-column:2;grid-row:3 / span 1" aria-label="Rom 3, størrelse M"><span class="nr">3</span><span class="size">M</span></div>
    <div class="cell" data-room="1" style="grid-column:2;grid-row:6 / span 1" aria-label="Rom 1, størrelse M"><span class="nr">1</span><span class="size">M</span></div>
    <div class="cell" data-room="2" style="grid-column:2;grid-row:7 / span 1" aria-label="Rom 2, størrelse M"><span class="nr">2</span><span class="size">M</span></div>
    <div class="cell" data-room="14" style="grid-column:2;grid-row:8 / span 2" aria-label="Rom 14, størrelse L"><span class="nr">14</span><span class="size">L</span></div>
    <div class="cell" data-room="19" style="grid-column:3;grid-row:1 / span 2" aria-label="Rom 19, størrelse L"><span class="nr">19</span><span class="size">L</span></div>
    <div class="cell" data-room="9" style="grid-column:3;grid-row:3 / span 1" aria-label="Rom 9, størrelse M"><span class="nr">9</span><span class="size">M</span></div>
    <div class="cell" data-room="10" style="grid-column:3;grid-row:4 / span 1" aria-label="Rom 10, størrelse M"><span class="nr">10</span><span class="size">M</span></div>
    <div class="cell" data-room="11" style="grid-column:3;grid-row:5 / span 1" aria-label="Rom 11, størrelse M"><span class="nr">11</span><span class="size">M</span></div>
    <div class="cell" data-room="12" style="grid-column:3;grid-row:6 / span 1" aria-label="Rom 12, størrelse M"><span class="nr">12</span><span class="size">M</span></div>
    <div class="cell" data-room="13" style="grid-column:3;grid-row:7 / span 1" aria-label="Rom 13, størrelse M"><span class="nr">13</span><span class="size">M</span></div>
    <div class="cell" data-room="16" style="grid-column:3;grid-row:8 / span 2" aria-label="Rom 16, størrelse L"><span class="nr">16</span><span class="size">L</span></div>
    <div class="cell screen" style="grid-column:2;grid-row:4 / span 2"><span class="nr">Skjerm</span></div>
  </div>

  <script>
    // Valgfritt og ikke nødvendig for visningen. Status kan senere settes slik:
    // window.boxnRooms.setStatus({ 1: 'ledig', 2: 'opptatt', 14: 'feil' });
    window.boxnRooms = {
      setStatus: function (map) {
        var cells = document.querySelectorAll('[data-room]');
        for (var i = 0; i < cells.length; i++) {
          var n = cells[i].getAttribute('data-room');
          if (map && map[n]) { cells[i].setAttribute('data-status', map[n]); }
          else { cells[i].removeAttribute('data-status'); }
        }
      }
    };
  </script>
  <script>
    // Følger TagoIOs eget mønster: registrer callbacks, kall så ready().
    try {
      window.TagoIO.onStart(function () {});
      window.TagoIO.onRealtime(function () {});
      window.TagoIO.ready();
    } catch (e) {
      // Utenfor TagoIO (eller hvis skriptet ikke lastet) vises rommene likevel.
    }
  </script>
</body>
</html>
